<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion — Panel MC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#e6e8ee;
       min-height:100vh;display:grid;place-items:center}
  .card{width:340px;background:#171a21;border:1px solid #232834;border-radius:14px;
        padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  h1{margin:0 0 4px;font-size:20px}
  p.sub{margin:0 0 22px;color:#8a93a6;font-size:13px}
  label{display:block;font-size:12px;color:#8a93a6;margin:12px 0 6px}
  input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #262c39;
        background:#0f1115;color:#e6e8ee;font-size:14px;outline:none}
  input:focus{border-color:#4f8cff}
  button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;
         background:#4f8cff;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
  button:hover{background:#3d7ae8}
  .err{margin-top:14px;padding:10px;border-radius:8px;background:#3b1c22;
       color:#ff8a95;font-size:13px;text-align:center}
</style>
</head>
<body>
  <form class="card" method="post">
    <h1>🔒 Panel privé</h1>
    <p class="sub">Accès réservé à l'administrateur</p>
    <label>Utilisateur</label>
    <input name="username" autocomplete="username" autofocus required>
    <label>Mot de passe</label>
    <input name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Se connecter</button>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
  </form>
</body>
</html>
